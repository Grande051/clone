<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Banco</title>
</head>
<body>
    <h1>Simulador de Banco</h1>

    <h2>Saldo atual: <span id="saldo">R$ 1.000,00</span></h2>

    <label for="operacao">Escolha uma operação:</label>
    <select id="operacao">
        <option value="consultar">Consultar saldo</option>
        <option value="depositar">Depositar</option>
        <option value="sacar">Sacar</option>
        <option value="extrato">Ver extrato</option>
    </select>

    <br><br>
    <label for="valor">Valor:</label>
    <input type="number" id="valor" step="1" placeholder="Digite o valor">

    <button id="executar">Executar operação</button>

    <h3>Resultado:</h3>
    <div id="resultado" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
